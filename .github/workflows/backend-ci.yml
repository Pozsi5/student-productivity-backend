name: Backend CI - Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build --no-daemon

  push-image:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        # Bejelentkezés a GitHub Container Registry-be
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Tagging)

        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,enable=true,priority=100
            type=raw,value=latest,priority=0 # Az image-et 'latest'-ként is megjelöli

      - name: Build and Push Docker Image

        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

    deploy-staging:
      name: Deploy to Staging
      runs-on: ubuntu-latest
      needs: push-image
      environment: staging

      steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Set Staging Environment URL
          run: |
            echo "REDIS_HOST=redis-staging-server" >> $GITHUB_ENV
            echo "APP_PROFILE=staging" >> $GITHUB_ENV

        - name: Log in to GHCR
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.repository_owner }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Deploy Staging Image
          run: |
            IMAGE_TAG=$(echo ${{ github.sha }} | cut -c1-7)
            echo "--- STARTING DEPLOYMENT TO STAGING ---"
            echo "Profile used: ${{ env.APP_PROFILE }}"
            echo "Pulling image: ghcr.io/${{ github.repository }}/backend:$IMAGE_TAG"

            # 1. Image lehúzása a Staging szerveren (szimuláció)
            # docker pull ghcr.io/${{ github.repository }}/backend:$IMAGE_TAG

            # 2. Konténer indítása a staging konfigurációval
            # docker run -d --env SPRING_PROFILES_ACTIVE=staging ...

            echo "Deployment to Staging environment completed successfully."